[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "car-detection"
version = "1.0.0"
description = "Floor-coordinate toy-car detection and motion tracking"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
    "scipy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
